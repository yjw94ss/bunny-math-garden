<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>小兔子数胡萝卜 🥕</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%; width: 100%;
    overflow: hidden;
  }

  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    background: linear-gradient(180deg, #a8e6ff 0%, #d8f6c8 55%, #b6ea8f 100%);
    display: flex;
    justify-content: center;
    align-items: stretch;
    user-select: none;
    -webkit-user-select: none;
    color: #3b2f2a;
  }

  /* ============ 主布局 ============ */
  #app {
    position: relative;
    width: 100%;
    max-width: 520px;
    height: 100%;
    display: flex;
    flex-direction: column;
    gap: 4px;
    padding: 8px 10px 10px;
  }

  /* ============ 顶部信息条 ============ */
  #hud { display: flex; gap: 6px; align-items: center; flex: 0 0 auto; }

  .hud-item {
    background: rgba(255,255,255,.88);
    border-radius: 999px;
    padding: 5px 10px;
    font-size: 13px;
    font-weight: 800;
    box-shadow: 0 2px 5px rgba(0,0,0,.08);
    white-space: nowrap;
  }

  .hud-spacer { flex: 1; }

  .icon-btn {
    border: none;
    background: rgba(255,255,255,.88);
    border-radius: 999px;
    width: 34px; height: 34px;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 0 2px 5px rgba(0,0,0,.08);
    display: flex; align-items: center; justify-content: center;
    padding: 0;
    font-family: inherit;
  }
  .icon-btn:active { transform: scale(.92); }

  /* ============ 小兔子 + 对话泡 ============ */
  #bunnyRow {
    display: flex;
    align-items: center;
    gap: 8px;
    flex: 0 0 auto;
    padding: 2px 4px;
  }

  #bunny {
    font-size: 38px;
    line-height: 1;
    animation: bob 2s ease-in-out infinite;
    transform-origin: bottom center;
    flex: 0 0 auto;
  }
  @keyframes bob {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-6px); }
  }
  #bunny.happy { animation: hop .45s ease-in-out 3; }
  @keyframes hop {
    0%,100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-18px) scale(1.15); }
  }

  #bubble {
    position: relative;
    background: #fff;
    border-radius: 14px;
    padding: 7px 12px;
    font-size: 15px;
    font-weight: 800;
    box-shadow: 0 3px 8px rgba(0,0,0,.1);
    flex: 1;
    text-align: center;
    color: #4a3728;
  }
  #bubble::before {
    content: '';
    position: absolute;
    left: -8px; top: 50%;
    transform: translateY(-50%);
    border: 8px solid transparent;
    border-right-color: #fff;
  }

  /* ============ 当前数量 ============ */
  #countRow {
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 6px;
    flex: 0 0 auto;
  }
  .c-label { font-size: 16px; font-weight: 800; color: #5b7c3a; }

  #countNum {
    font-size: clamp(36px, 12vw, 54px);
    font-weight: 900;
    color: #ff6b35;
    line-height: 1;
    text-shadow: 0 2px 0 #fff, 0 4px 8px rgba(255,107,53,.35);
    display: inline-block;
    min-width: 1.1em;
    text-align: center;
  }
  #countNum.pop { animation: numPop .35s cubic-bezier(.34,1.56,.64,1); }
  @keyframes numPop {
    0% { transform: scale(1); }
    45% { transform: scale(1.4); }
    100% { transform: scale(1); }
  }

  /* ============ 篮子 ============ */
  #basketWrap {
    position: relative;
    flex: 1 1 auto;
    min-height: 158px;
    width: 100%;
    max-width: 380px;
    margin: 0 auto;
  }

  #basket {
    position: absolute;
    left: 6px; right: 6px; bottom: 0; top: 26px;
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 8px, transparent 8px 18px),
      linear-gradient(180deg, #e8b073, #cd8c4a 45%, #a86e33);
    border: 5px solid #8a5a2b;
    border-radius: 12px 12px 58px 58px / 12px 12px 80px 80px;
    box-shadow: inset 0 10px 18px rgba(255,255,255,.35), 0 8px 14px rgba(0,0,0,.15);
  }

  #basket::before {
    content: '';
    position: absolute;
    left: -12px; right: -12px; top: -22px; height: 24px;
    background: linear-gradient(180deg, #c98b4b, #8a5a2b);
    border-radius: 12px;
    border: 3px solid #6f4520;
    box-shadow: 0 3px 6px rgba(0,0,0,.2);
    z-index: 1;
  }

  #carrots {
    position: absolute;
    left: 20px; right: 20px; top: 30px; bottom: 12px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    align-content: end;
    justify-items: center;
    gap: 0;
    z-index: 3;
    pointer-events: none;
  }

  .carrot {
    font-size: clamp(22px, 7.2vw, 32px);
    line-height: 1.12;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,.3));
    display: block;
    transition: transform .2s ease, filter .2s ease;
  }

  .carrot.drop { animation: dropIn .42s cubic-bezier(.34,1.56,.64,1); }
  @keyframes dropIn {
    0% { transform: translateY(-70px) scale(.35) rotate(-30deg); opacity: 0; }
    70% { transform: translateY(4px) scale(1.15) rotate(6deg); opacity: 1; }
    100% { transform: translateY(0) scale(1) rotate(0deg); opacity: 1; }
  }

  .carrot.count-hi {
    transform: scale(1.5) translateY(-4px);
    filter: drop-shadow(0 0 10px #ffd166) drop-shadow(0 0 4px #fff);
  }

  #ghostLayer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 4;
  }

  .fly-out { animation: flyOut .42s ease-in forwards; }
  @keyframes flyOut {
    0% { transform: translateY(0) scale(1); opacity: 1; }
    100% { transform: translateY(-90px) scale(.35) rotate(40deg); opacity: 0; }
  }

  /* ============ 加减按钮 ============ */
  #controls { display: flex; gap: 10px; flex: 0 0 auto; }

  #controls button {
    flex: 1;
    min-height: 60px;
    border: none;
    border-radius: 18px;
    font-family: inherit;
    font-size: clamp(17px, 5vw, 21px);
    font-weight: 900;
    color: #fff;
    cursor: pointer;
    letter-spacing: 1px;
    transition: transform .08s ease, box-shadow .08s ease, filter .2s;
    touch-action: manipulation;
  }

  #plusBtn {
    background: linear-gradient(180deg, #6fdc7b, #34a83f);
    box-shadow: 0 5px 0 #1e7a28;
  }
  #minusBtn {
    background: linear-gradient(180deg, #ff9285, #e04b3a);
    box-shadow: 0 5px 0 #a3301f;
  }
  #plusBtn:active { transform: translateY(5px); box-shadow: 0 0 0 #1e7a28; }
  #minusBtn:active { transform: translateY(5px); box-shadow: 0 0 0 #a3301f; }

  #controls button.dim { filter: grayscale(.55) brightness(1.12); opacity: .78; }

  .shake { animation: shakeX .4s; }
  @keyframes shakeX {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-8px); }
    40% { transform: translateX(8px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  /* ============ 提示行 ============ */
  #hintRow { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }

  #countBtn {
    border: none;
    border-radius: 999px;
    padding: 8px 12px;
    background: linear-gradient(180deg, #ffe08a, #f5b731);
    color: #6b4a00;
    font-weight: 900;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
    white-space: nowrap;
    box-shadow: 0 3px 0 #c99118;
    min-height: 38px;
    flex: 0 0 auto;
  }
  #countBtn:active { transform: translateY(3px); box-shadow: none; }

  #hint {
    flex: 1;
    font-size: 13px;
    font-weight: 700;
    color: #5b7c3a;
    text-align: right;
    line-height: 1.3;
  }
  #hint.warn { color: #d94b32; }

  /* ============ 星星弹出 ============ */
  .stars-pop {
    position: absolute;
    left: 50%;
    top: 8%;
    transform: translateX(-50%);
    font-size: 30px;
    z-index: 12;
    animation: starsUp 1.6s ease-out forwards;
    pointer-events: none;
    filter: drop-shadow(0 2px 4px rgba(0,0,0,.25));
    white-space: nowrap;
  }
  @keyframes starsUp {
    0% { opacity: 0; transform: translateX(-50%) translateY(20px) scale(.5); }
    30% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.2); }
    100% { opacity: 0; transform: translateX(-50%) translateY(-44px) scale(1); }
  }

  /* ============ 覆盖层 ============ */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(40, 60, 30, .55);
    backdrop-filter: blur(3px);
    -webkit-backdrop-filter: blur(3px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 16px;
  }
  .overlay.hidden { display: none; }

  .panel {
    background: #fffdf5;
    border-radius: 24px;
    padding: 22px 20px;
    width: 100%;
    max-width: 360px;
    text-align: center;
    box-shadow: 0 16px 40px rgba(0,0,0,.3);
    border: 4px solid #ffd166;
    max-height: 92vh;
    overflow-y: auto;
  }

  .panel-title {
    font-size: 22px;
    font-weight: 900;
    color: #ff6b35;
    margin-bottom: 12px;
  }

  .rules {
    text-align: left;
    font-size: 15px;
    line-height: 1.8;
    color: #4a3728;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .rules b.green { color: #2fa63c; }
  .rules b.red { color: #e04b3a; }

  .start-btn {
    width: 100%;
    border: none;
    border-radius: 18px;
    padding: 16px;
    font-size: 21px;
    font-weight: 900;
    color: #fff;
    background: linear-gradient(180deg, #6fdc7b, #34a83f);
    box-shadow: 0 6px 0 #1e7a28;
    font-family: inherit;
    cursor: pointer;
    letter-spacing: 2px;
  }
  .start-btn:active { transform: translateY(6px); box-shadow: none; }

  .big-score {
    font-size: 46px;
    font-weight: 900;
    color: #ff6b35;
    margin: 6px 0 4px;
    text-shadow: 0 2px 0 #fff;
  }

  /* ============ 成就提示 ============ */
  #toast {
    position: fixed;
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 80;
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: center;
    pointer-events: none;
  }

  .toast-item {
    background: linear-gradient(180deg, #fff6cf, #ffd76e);
    border: 3px solid #e0a300;
    color: #7a5200;
    font-weight: 900;
    font-size: 14px;
    padding: 8px 16px;
    border-radius: 999px;
    box-shadow: 0 6px 16px rgba(0,0,0,.2);
    animation: toastLife 2.2s ease forwards;
    white-space: nowrap;
  }

  @keyframes toastLife {
    0% { opacity: 0; transform: translateY(-16px) scale(.9); }
    12% { opacity: 1; transform: translateY(0) scale(1); }
    80% { opacity: 1; transform: translateY(0) scale(1); }
    100% { opacity: 0; transform: translateY(-10px) scale(.95); }
  }

  /* ============ 彩纸 ============ */
  #fx {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 60;
  }

  .confetti {
    position: absolute;
    top: 42%;
    width: 10px;
    height: 14px;
    border-radius: 3px;
    animation: confettiFly 1.15s ease-out forwards;
  }

  @keyframes confettiFly {
    0% { transform: translate(0, 0) rotate(0deg); opacity: 1; }
    100% {
      transform: translate(var(--dx), calc(var(--dy) + 300px)) rotate(var(--rot));
      opacity: 0;
    }
  }

  /* ============ 小屏适配 ============ */
  @media (max-height: 640px) {
    #bunny { font-size: 30px; }
    #bubble { font-size: 13px; padding: 5px 10px; }
    #countNum { font-size: 38px; }
    #basketWrap { min-height: 140px; }
    #controls button { min-height: 52px; font-size: 17px; }
    .carrot { font-size: 23px; }
    .rules { font-size: 14px; line-height: 1.65; }
    .panel-title { font-size: 19px; }
  }
</style>

</head>
<body>

<div id="app">
  <div id="hud">
    <div class="hud-item">⭐ <span id="score">0</span></div>
    <div class="hud-item">🎯 <span id="roundNum">1</span>/10</div>
    <div class="hud-item">🏆 <span id="best">0</span></div>
    <div class="hud-spacer"></div>
    <button id="soundBtn" class="icon-btn" onclick="toggleSound()" title="声音开关">🔊</button>
    <button id="pauseBtn" class="icon-btn" onclick="togglePause()" title="暂停">⏸</button>
  </div>

  <div id="bunnyRow">
    <div id="bunny">🐰</div>
    <div id="bubble">我想要 3 根胡萝卜！</div>
  </div>

  <div id="countRow">
    <span class="c-label">现在有</span>
    <span id="countNum">0</span>
    <span class="c-label">根</span>
  </div>

  <div id="basketWrap">
    <div id="basket">
      <div id="carrots"></div>
    </div>
    <div id="ghostLayer"></div>
  </div>

  <div id="controls">
    <button id="minusBtn" onclick="changeCount(-1)">➖ 减1根</button>
    <button id="plusBtn" onclick="changeCount(1)">➕ 加1根</button>
  </div>

  <div id="hintRow">
    <button id="countBtn" onclick="countAloud()">🔢 一起数一数</button>
    <div id="hint">点按钮，让胡萝卜变成 3 根吧！</div>
  </div>
</div>

<div id="fx"></div>
<div id="toast"></div>

<!-- 开始界面 -->
<div id="startScreen" class="overlay">
  <div class="panel">
    <div class="panel-title">🥕 小兔子数胡萝卜 🐰</div>
    <div class="rules">
      <p>1️⃣ 小兔子想吃胡萝卜，它会告诉你想要几根！</p>
      <p>2️⃣ 点 <b class="green">加1根</b>，胡萝卜就变多，数字也变大。</p>
      <p>3️⃣ 点 <b class="red">减1根</b>，胡萝卜就变少，数字也变小。</p>
      <p>4️⃣ 变的正好是小兔子要的数量，就过关啦！</p>
      <p>5️⃣ 最多 10 根，最少 0 根哦～</p>
    </div>
    <button class="start-btn" onclick="startGame()">开始游戏</button>
  </div>
</div>

<!-- 通关界面 -->
<div id="gameOverScreen" class="overlay hidden">
  <div class="panel">
    <div class="panel-title">🎉 全部完成啦！</div>
    <div style="font-size:15px;font-weight:800;color:#5b7c3a;">你一共得到</div>
    <div class="big-score" id="finalScore">0</div>
    <div style="font-size:15px;font-weight:800;color:#5b7c3a;margin-bottom:16px;">分，小兔子吃得好饱！🐰💕</div>
    <button class="start-btn" onclick="restartGame()">再玩一次</button>
  </div>
</div>

<!-- 暂停界面 -->
<div id="pauseScreen" class="overlay hidden">
  <div class="panel">
    <div class="panel-title">⏸ 休息一下</div>
    <div style="font-size:15px;font-weight:800;color:#5b7c3a;margin-bottom:16px;">小兔子在等你回来哦～</div>
    <button class="start-btn" onclick="togglePause()">继续游戏</button>
  </div>
</div>

<script>
'use strict';

/* ====================== 常量与状态 ====================== */

var MAX_CARROTS = 10;
var TOTAL_ROUNDS = 10;

var ACHIEVEMENTS = [
  { id: 'first_add', name: '第一次加', icon: '➕' },
  { id: 'first_sub', name: '第一次减', icon: '➖' },
  { id: 'full10',    name: '满篮啦（10根）', icon: '🧺' },
  { id: 'empty0',    name: '空空的（0根）', icon: '😮' },
  { id: 'perfect',   name: '一次就对', icon: '⭐' },
  { id: 'combo3',    name: '连对3关', icon: '🔥' },
  { id: 'finish',    name: '全部完成', icon: '🏆' }
];

var state = {
  count: 0,
  target: 0,
  round: 1,
  score: 0,
  wrong: 0,
  roundStart: 0,
  active: false,
  paused: false,
  busy: false,
  soundOn: true,
  perfectStreak: 0
};

var unlocked = {};
var best = 0;
var audioCtx = null;
var countToken = 0;
var el = {};

/* ====================== 小工具 ====================== */

function randInt(a, b) {
  if (b < a) { var t = a; a = b; b = t; }
  return Math.floor(Math.random() * (b - a + 1)) + a;
}

function loadSave() {
  try {
    var raw = localStorage.getItem('rabbit_carrot_save');
    if (!raw) return {};
    return JSON.parse(raw) || {};
  } catch (e) { return {}; }
}

function persistSave() {
  try {
    localStorage.setItem('rabbit_carrot_save', JSON.stringify({
      best: best,
      unlocked: unlocked
    }));
  } catch (e) {}
}

/* ====================== 声音 ====================== */

function ensureAudio() {
  if (!audioCtx) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { audioCtx = null; }
  }
  if (audioCtx && audioCtx.state === 'suspended') {
    try { audioCtx.resume(); } catch (e) {}
  }
}

function beep(freq, dur, type, vol) {
  if (!state.soundOn) return;
  ensureAudio();
  if (!audioCtx) return;
  try {
    var t = audioCtx.currentTime;
    var o = audioCtx.createOscillator();
    var g = audioCtx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol || 0.07, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t);
    o.stop(t + dur + 0.03);
  } catch (e) {}
}

function speak(text) {
  if (!state.soundOn) return;
  if (!('speechSynthesis' in window)) return;
  try {
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.lang = 'zh-CN';
    u.rate = 0.95;
    u.pitch = 1.25;
    u.volume = 1;
    window.speechSynthesis.speak(u);
  } catch (e) {}
}

/* ====================== 成就 ====================== */

function unlock(id) {
  if (unlocked[id]) return;
  var a = null;
  for (var i = 0; i < ACHIEVEMENTS.length; i++) {
    if (ACHIEVEMENTS[i].id === id) { a = ACHIEVEMENTS[i]; break; }
  }
  if (!a) return;
  unlocked[id] = true;
  persistSave();
  showToast('🏅 ' + a.icon + ' ' + a.name);
  beep(920, 0.1, 'triangle', 0.06);
}

function showToast(text) {
  if (!el.toast) return;
  var t = document.createElement('div');
  t.className = 'toast-item';
  t.textContent = text;
  el.toast.appendChild(t);
  setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, 2200);
}

/* ====================== 视觉反馈 ====================== */

function confettiBurst() {
  if (!el.fx) return;
  var colors = ['#ff6b35', '#ffd166', '#06d6a0', '#118ab2', '#ef476f', '#a06cd5'];
  for (var i = 0; i < 30; i++) {
    var p = document.createElement('div');
    p.className = 'confetti';
    p.style.left = (50 + (Math.random() - 0.5) * 34) + '%';
    p.style.background = colors[Math.floor(Math.random() * colors.length)];
    p.style.setProperty('--dx', ((Math.random() * 2 - 1) * 170) + 'px');
    p.style.setProperty('--dy', (-90 - Math.random() * 170) + 'px');
    p.style.setProperty('--rot', (Math.random() * 720 - 360) + 'deg');
    p.style.animationDelay = (Math.random() * 0.16) + 's';
    el.fx.appendChild(p);
    (function (node) {
      setTimeout(function () { if (node.parentNode) node.parentNode.removeChild(node); }, 1500);
    })(p);
  }
}

function showStars(n) {
  if (!el.basketWrap) return;
  var d = document.createElement('div');
  d.className = 'stars-pop';
  var s = '';
  for (var i = 0; i < n; i++) s += '⭐';
  d.textContent = s;
  el.basketWrap.appendChild(d);
  setTimeout(function () { if (d.parentNode) d.parentNode.removeChild(d); }, 1700);
}

function shakeButton(btn) {
  if (!btn) return;
  btn.classList.remove('shake');
  void btn.offsetWidth;
  btn.classList.add('shake');
  setTimeout(function () { btn.classList.remove('shake'); }, 420);
}

function setHint(text, warn) {
  el.hint.textContent = text;
  if (warn) el.hint.classList.add('warn');
  else el.hint.classList.remove('warn');
}

/* ====================== 胡萝卜渲染 ====================== */

function rebuildCarrots(n) {
  el.carrots.innerHTML = '';
  for (var i = 0; i < n; i++) {
    var c = document.createElement('div');
    c.className = 'carrot';
    c.textContent = '🥕';
    el.carrots.appendChild(c);
  }
}

function addCarrot() {
  if (el.carrots.children.length >= MAX_CARROTS) return;
  var c = document.createElement('div');
  c.className = 'carrot drop';
  c.textContent = '🥕';
  el.carrots.appendChild(c);
}

function removeCarrot() {
  var last = el.carrots.lastElementChild;
  if (!last) return;

  var wrapRect = el.basketWrap.getBoundingClientRect();
  var r = last.getBoundingClientRect();

  var ghost = last.cloneNode(true);
  ghost.classList.remove('drop');
  ghost.classList.add('fly-out');
  ghost.style.position = 'absolute';
  ghost.style.left = (r.left - wrapRect.left) + 'px';
  ghost.style.top = (r.top - wrapRect.top) + 'px';
  ghost.style.width = r.width + 'px';
  ghost.style.height = r.height + 'px';
  ghost.style.margin = '0';
  ghost.style.lineHeight = '1.12';
  el.ghostLayer.appendChild(ghost);
  setTimeout(function () { if (ghost.parentNode) ghost.parentNode.removeChild(ghost); }, 480);

  el.carrots.removeChild(last);
}

/* ====================== 数字与按钮 ====================== */

function updateCountDisplay(animate) {
  el.countNum.textContent = state.count;
  if (animate !== false) {
    el.countNum.classList.remove('pop');
    void el.countNum.offsetWidth;
    el.countNum.classList.add('pop');
  }
  updateButtons();
}

function updateButtons() {
  if (state.count >= MAX_CARROTS) el.plusBtn.classList.add('dim');
  else el.plusBtn.classList.remove('dim');

  if (state.count <= 0) el.minusBtn.classList.add('dim');
  else el.minusBtn.classList.remove('dim');
}

/* ====================== 核心玩法 ====================== */

function changeCount(delta) {
  if (!state.active || state.paused || state.busy) return;
  ensureAudio();

  var before = state.count;
  var next = before + delta;

  if (next > MAX_CARROTS) {
    setHint('哎呀，篮子里最多只能放 10 根啦！不能再加喽～', true);
    shakeButton(el.plusBtn);
    beep(200, 0.18, 'square', 0.06);
    speak('最多只能放10根啦');
    return;
  }

  if (next < 0) {
    setHint('篮子里已经空空的啦！不能再减喽～', true);
    shakeButton(el.minusBtn);
    beep(200, 0.18, 'square', 0.06);
    speak('已经没有了，不能再减啦');
    return;
  }

  state.count = next;
  if (delta > 0) addCarrot();
  else removeCarrot();

  updateCountDisplay(true);

  var distBefore = Math.abs(before - state.target);
  var distAfter = Math.abs(next - state.target);
  var movedAway = distAfter > distBefore;
  if (movedAway) state.wrong++;

  if (delta > 0) beep(480 + next * 32, 0.1, 'sine', 0.07);
  else beep(430 - next * 8, 0.12, 'sine', 0.07);

  speak('现在有' + next + '根');

  if (state.count === 0) unlock('empty0');
  if (state.count === MAX_CARROTS) unlock('full10');
  if (delta > 0) unlock('first_add');
  else unlock('first_sub');

  if (next === state.target) {
    completeRound();
    return;
  }

  if (movedAway) {
    setHint('离 ' + state.target + ' 根更远啦，换一个按钮试试！', true);
  } else if (distAfter === 1) {
    setHint('快到了！现在是 ' + next + ' 根，再点一下就好啦！');
  } else {
    setHint('现在是 ' + next + ' 根，还差 ' + distAfter + ' 根就到 ' + state.target + ' 根啦！');
  }
}

function completeRound() {
  state.busy = true;
  countToken++;

  var elapsed = (Date.now() - state.roundStart) / 1000;
  var fast = elapsed <= 10;

  var pts = 10;
  if (fast) pts += 5;

  var stars = state.wrong === 0 ? 3 : (state.wrong <= 2 ? 2 : 1);

  if (stars === 3) state.perfectStreak++;
  else state.perfectStreak = 0;

  state.score += pts;
  el.scoreEl.textContent = state.score;

  if (stars === 3) unlock('perfect');
  if (state.perfectStreak >= 3) unlock('combo3');

  el.bunny.classList.add('happy');
  el.bubble.textContent = '哇！正好 ' + state.target + ' 根！谢谢你！';
  setHint('✅ 成功啦！加 ' + pts + ' 分' + (fast ? '（速度奖励 +5）' : ''), false);
  speak('太棒啦，' + state.target + '根，谢谢你');

  beep(660, 0.12, 'sine', 0.08);
  setTimeout(function () { beep(880, 0.18, 'sine', 0.08); }, 130);

  confettiBurst();
  showStars(stars);

  setTimeout(function () {
    el.bunny.classList.remove('happy');
    if (state.round >= TOTAL_ROUNDS) {
      endGame();
    } else {
      state.round++;
      setupRound();
    }
  }, 1900);
}

function setupRound() {
  var r = state.round;
  el.roundEl.textContent = r;

  var lo = 1, hi = 5;
  if (r >= 7) { lo = 3; hi = 10; }
  else if (r >= 4) { lo = 2; hi = 8; }

  var target = randInt(lo, hi);
  var start = 0;

  if (r >= 4) {
    var roll = Math.random();
    if (roll < 0.3) {
      start = randInt(0, Math.max(0, target - 1));
    } else if (roll < 0.6 && target < MAX_CARROTS) {
      start = randInt(target + 1, MAX_CARROTS);
    }
  }
  if (start === target) start = 0;

  state.target = target;
  state.count = start;
  state.wrong = 0;
  state.roundStart = Date.now();
  state.busy = false;

  rebuildCarrots(start);
  updateCountDisplay(false);
  updateButtons();

  el.bubble.textContent = '我想要 ' + target + ' 根胡萝卜！';
  setHint('点下面的按钮，把胡萝卜变成 ' + target + ' 根吧！', false);
  speak('我想要' + target + '根胡萝卜');
}

function startGame() {
  ensureAudio();

  el.startScreen.classList.add('hidden');
  el.gameOverScreen.classList.add('hidden');
  el.pauseScreen.classList.add('hidden');

  state.score = 0;
  state.round = 1;
  state.perfectStreak = 0;
  state.active = true;
  state.paused = false;
  state.busy = false;

  el.scoreEl.textContent = '0';
  document.getElementById('pauseBtn').textContent = '⏸';

  setupRound();
}

function restartGame() {
  startGame();
}

function endGame() {
  state.active = false;
  state.busy = false;

  if (state.score > best) {
    best = state.score;
    el.bestEl.textContent = best;
  }
  persistSave();
  unlock('finish');

  document.getElementById('finalScore').textContent = state.score;
  el.gameOverScreen.classList.remove('hidden');
  speak('你一共得到' + state.score + '分，真棒');
}

/* ====================== 一起数一数 ====================== */

function countAloud() {
  if (!state.active || state.paused || state.busy) return;
  ensureAudio();

  var token = ++countToken;
  var items = Array.prototype.slice.call(el.carrots.children);

  if (items.length === 0) {
    speak('篮子里一根也没有，是零根');
    setHint('篮子里 0 根，空空的～');
    beep(300, 0.15, 'sine', 0.06);
    return;
  }

  setHint('跟着小兔子一起数一数吧！');

  var i = 0;
  function step() {
    if (token !== countToken) return;
    if (i >= items.length) {
      speak('一共' + items.length + '根');
      setHint('一共 ' + items.length + ' 根胡萝卜！🥕');
      return;
    }
    var node = items[i];
    if (!node || !node.parentNode) { i++; setTimeout(step, 120); return; }

    node.classList.add('count-hi');
    beep(520 + i * 45, 0.1, 'sine', 0.06);
    speak(String(i + 1));

    (function (n) {
      setTimeout(function () { n.classList.remove('count-hi'); }, 440);
    })(node);

    i++;
    setTimeout(step, 720);
  }
  step();
}

/* ====================== 暂停 / 声音 ====================== */

function togglePause() {
  if (!state.active) return;
  state.paused = !state.paused;

  if (state.paused) {
    countToken++;
    el.pauseScreen.classList.remove('hidden');
    document.getElementById('pauseBtn').textContent = '▶';
    if ('speechSynthesis' in window) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }
  } else {
    el.pauseScreen.classList.add('hidden');
    document.getElementById('pauseBtn').textContent = '⏸';
  }
}

function toggleSound() {
  state.soundOn = !state.soundOn;
  document.getElementById('soundBtn').textContent = state.soundOn ? '🔊' : '🔇';
  if (!state.soundOn && 'speechSynthesis' in window) {
    try { window.speechSynthesis.cancel(); } catch (e) {}
  }
  if (state.soundOn) beep(700, 0.1, 'sine', 0.07);
}

/* ====================== 初始化 ====================== */

function initGame() {
  el.scoreEl   = document.getElementById('score');
  el.roundEl   = document.getElementById('roundNum');
  el.bestEl    = document.getElementById('best');
  el.bubble    = document.getElementById('bubble');
  el.bunny     = document.getElementById('bunny');
  el.countNum  = document.getElementById('countNum');
  el.carrots   = document.getElementById('carrots');
  el.hint      = document.getElementById('hint');
  el.plusBtn   = document.getElementById('plusBtn');
  el.minusBtn  = document.getElementById('minusBtn');
  el.basketWrap = document.getElementById('basketWrap');
  el.ghostLayer = document.getElementById('ghostLayer');
  el.startScreen    = document.getElementById('startScreen');
  el.gameOverScreen = document.getElementById('gameOverScreen');
  el.pauseScreen    = document.getElementById('pauseScreen');
  el.toast = document.getElementById('toast');
  el.fx    = document.getElementById('fx');

  var save = loadSave();
  best = save.best || 0;
  unlocked = save.unlocked || {};

  el.bestEl.textContent = best;
  el.roundEl.textContent = '1';
  updateButtons();

  // 键盘支持（方便家长在电脑上辅助）
  document.addEventListener('keydown', function (e) {
    if (!state.active) return;
    if (e.key === 'ArrowUp' || e.key === '+' || e.key === '=') {
      changeCount(1);
      e.preventDefault();
    } else if (e.key === 'ArrowDown' || e.key === '-' || e.key === '_') {
      changeCount(-1);
      e.preventDefault();
    }
  });

  // 防止移动端双击缩放
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
}

initGame();

/* 暴露给 inline onclick 使用 */
window.startGame   = startGame;
window.restartGame = restartGame;
window.changeCount = changeCount;
window.countAloud  = countAloud;
window.togglePause = togglePause;
window.toggleSound = toggleSound;
</script>
</body>
